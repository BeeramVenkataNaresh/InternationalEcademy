<div class="page-position">
    <h1 class="text-center text-primary">Dash Board</h1>
    <div class="container mt-4">
        <div class="card border-primary">
            <form [formGroup]="dashBoardForm">
                <div class="card-header">
                    <i class="fa fa-list text-success"></i>&nbsp;&nbsp;<span class="text-danger">[User]: </span> <b class="text-primary"> {{loginUser}}</b> / 
                    <span class="text-danger">[Role]: </span> <b class="text-success"> {{loginUserRole}}</b>
                </div>
                <div class="card-body">
                   <h3 class="text-center">Welcome</h3>
                </div>
            </form>
        </div>
    </div>
</div>
